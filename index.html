<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <div class="profile-card">
      <div class="card-header"></div>

      <div class="card-content">
        <img
          class="avatar"
          src="./images/image-victor.jpg"
          alt="Victor Crest"
        />

        <h1>Victor Crest <span>26</span></h1>
        <p>London</p>

        <ul>
          <li><strong>80K</strong><span>Followers</span></li>
          <li><strong>803K</strong><span>Likes</span></li>
          <li><strong>1.4K</strong><span>Photos</span></li>
        </ul>
      </div>
    </div>
  </body>
</html>
